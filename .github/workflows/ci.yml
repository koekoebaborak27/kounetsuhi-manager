name: CI

# paths-ignore: ドキュメントだけの変更では CI を起動しない。
# 変更ファイルが「すべて」パターンに一致する場合にのみスキップされるため、
# 1 ファイルでもコードが混ざれば通常どおり全ステップが実行される。
# （このファイル自体は対象外なので、ci.yml の変更は必ず CI で検証される）
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    # マイグレーションを 0 から流せるかを確かめるための、使い捨ての DB を起動する。
    # 開発用（docker/docker-compose.yml）と同じ PostgreSQL 17・同じ接続情報にそろえる。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kounetsuhi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d kounetsuhi_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Prisma CLI（prisma.config.ts）が読む接続先。CI には .env が無いのでここで渡す。
    env:
      DATABASE_URL: postgresql://app:password@localhost:5432/kounetsuhi_dev

    steps:
      - uses: actions/checkout@v7

      # pnpm は setup-node より先に入れる（setup-node の cache: pnpm が
      # pnpm store path を実行するため、pnpm が PATH にある必要がある）。
      # バージョンは package.json の packageManager フィールドから解決される。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # 型を参照する Typecheck / Test より前に、Prisma のコードを生成する。
      # （生成物は Git に入れていないため、生成前に tsc すると型が見つからず失敗する）
      - name: Prisma validate
        run: pnpm exec prisma validate
      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      # マイグレーションだけで 0 から DB を再現できることを確かめる。
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm test

      # 本番用のビルドが通ることを確かめる（Prisma のコードは上で生成済み）。
      - name: Build
        run: pnpm build
